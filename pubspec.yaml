name: mrz
description: "MRZ identity scanner example app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  auto_route: ^11.1.0
  get_it: ^8.2.0
  injectable: ^2.5.2
  permission_handler: ^12.0.1
  camera: ^0.11.2
  flutter_tesseract_ocr: ^0.4.31
  google_mlkit_text_recognition: ^0.15.1
  opencv_dart: ^2.2.1+4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  auto_route_generator:
  injectable_generator:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/tessdata/
    - assets/tessdata_config.json

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
      exclude_modules:
        - dnn
        - highgui
        - videoio
        - stitching
        - objdetect
        - photo
