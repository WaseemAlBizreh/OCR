name: mrz
description: "MRZ identity scanner example app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mrz_scanner_plus:
    git:
      url: https://github.com/ahmedkubur/mrz-scanner.git
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  auto_route: ^11.1.0
  get_it: ^8.2.0
  injectable: ^2.5.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  auto_route_generator:
  injectable_generator:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
